spring:
  application:
    name: short-link-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/short_link?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted   # 逻辑删除字段，对应 short_link 表
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # HMAC-SHA256 签名密钥，必须至少 32 字节；生产环境要换成环境变量注入
  secret: hou-short-link-jwt-secret-please-change-in-prod-0123456789
  expire-days: 7   # token 有效期（天）
